name: CI - Quality Gates & Testes

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'test/**'
      - 'chore/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Frontend Quality Gate (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Static Linter
        working-directory: frontend
        run: npx eslint src --quiet

      - name: Verify Frontend Production Build
        working-directory: frontend
        env:
          VITE_API_URL: "http://localhost:5000"
          VITE_GOOGLE_CLIENT_ID: "mock-client-id"
        run: npm run build

  test-backend:
    name: Backend Quality Gate (Hermetic Tests & SRE Resiliency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run Hermetic Pytest Suite (Unit, BDD, Contracts, SRE)
        env:
          SECRET_KEY: "ci-secret-key-test-production-ready-32-chars"
          JWT_SECRET_KEY: "ci-jwt-secret-test-production-ready-32-chars"
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: "testing"
          RUN_SCHEDULER: "false"
        run: |
          pytest backend/tests -v --tb=short

      - name: Run Legacy Smoke API Check
        env:
          SECRET_KEY: "ci-secret-key-test-production-ready-32-chars"
          JWT_SECRET_KEY: "ci-jwt-secret-test-production-ready-32-chars"
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: "testing"
        run: |
          PYTHONPATH=backend python backend/test_contact_api.py
