name: CI - Quality Gates & Testes

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Production Build
        working-directory: frontend
        env:
          VITE_API_URL: "http://localhost:5000"
          VITE_GOOGLE_CLIENT_ID: "mock-client-id"
        run: npm run build

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Backend Integration & Smoke Tests
        env:
          SECRET_KEY: "ci-secret-key-test"
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: "testing"
          GEMINI_API_KEY: "mock-gemini-key"
        run: |
          python backend/test_contact_api.py
