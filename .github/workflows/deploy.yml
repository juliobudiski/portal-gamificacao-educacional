name: Deploy GamificaEdu to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deploy-tests:
    name: Pre-Deploy Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_GOOGLE_CLIENT_ID: "133837215411-f108mo4flmbqmtpofs2k1876kkrnl6tg.apps.googleusercontent.com"
        run: |
          npm ci
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Run Backend Smoke Tests
        env:
          SECRET_KEY: "deploy-check-secret"
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: "testing"
          GEMINI_API_KEY: "mock-key"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python backend/test_contact_api.py

  deploy:
    name: Sync & Deploy to VPS
    needs: pre-deploy-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend for Production
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_GOOGLE_CLIENT_ID: "133837215411-f108mo4flmbqmtpofs2k1876kkrnl6tg.apps.googleusercontent.com"
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Files to VPS
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_vps" \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gamificaedu/backend/
          
          rsync -avz --delete -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_vps" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gamificaedu/frontend/dist/

      - name: Restart Web Service
        run: |
          ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_vps ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            docker cp /opt/gamificaedu/backend gamificaedu-web:/app/ && \
            docker restart gamificaedu-web
          "

      - name: Post-Deploy Health Check
        run: |
          echo "Verificando disponibilidade do serviço pós-deploy..."
          ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/id_vps ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            for i in {1..10}; do
              if curl -s -f http://localhost:5000/api/contact/health 2>/dev/null || curl -s -f http://localhost:5000/api/health 2>/dev/null || curl -s -f http://localhost:5000/ 2>/dev/null; then
                echo '✅ Serviço web respondendo adequadamente!'
                exit 0
              fi
              echo 'Aguardando container subir... tentativa '\$i'/10'
              sleep 2
            done
            echo '⚠️ Aviso: Container reiniciado, verifique docker logs gamificaedu-web se houver inconsistências.'
          "
